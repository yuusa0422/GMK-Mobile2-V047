name: Build GMK Android APK

on:
  workflow_dispatch:
    inputs:
      source_track:
        description: Select the source track to build
        type: choice
        options:
          - production
          - research
        default: production
        required: true
  push:

permissions:
  contents: read

concurrency:
  group: gmk-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select source archive by internal version
        id: locate
        shell: bash
        env:
          SOURCE_TRACK: ${{ inputs.source_track || 'production' }}
        run: |
          set -euo pipefail

          python3 <<'PY2'
          from pathlib import Path, PurePosixPath
          import zipfile, os, sys, shutil, re, hashlib, json

          root = Path(".")
          buildsrc = root / "buildsrc"
          shutil.rmtree(buildsrc, ignore_errors=True)
          requested_track = os.environ.get("SOURCE_TRACK", "production").strip().lower()
          if requested_track not in {"production", "research"}:
              print("ERROR: source_track must be production or research")
              sys.exit(2)

          def safe_extract(zf: zipfile.ZipFile, destination: Path):
              destination.mkdir(parents=True, exist_ok=True)
              root_resolved = destination.resolve()
              seen = set()
              for info in zf.infolist():
                  # Normalize separators before validation and extraction. Reject
                  # traversal, drive-prefixed paths, links, and duplicate targets.
                  name = info.filename.replace("\\", "/")
                  normalized = PurePosixPath(name)
                  if (normalized.is_absolute() or ".." in normalized.parts
                          or re.match(r"^[A-Za-z]:", name)):
                      raise RuntimeError(f"Unsafe ZIP path: {info.filename}")
                  target = (destination / Path(*normalized.parts)).resolve()
                  if target != root_resolved and root_resolved not in target.parents:
                      raise RuntimeError(f"Unsafe ZIP path: {info.filename}")
                  relative = target.relative_to(root_resolved).as_posix()
                  if relative in seen:
                      raise RuntimeError(f"Duplicate ZIP target: {info.filename}")
                  seen.add(relative)
                  unix_mode = (info.external_attr >> 16) & 0o170000
                  if unix_mode == 0o120000:
                      raise RuntimeError(f"Symlink entry is not allowed: {info.filename}")
                  if unix_mode not in (0, 0o100000, 0o040000):
                      raise RuntimeError(f"Special ZIP entry is not allowed: {info.filename}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, target.open("wb") as output:
                          shutil.copyfileobj(source, output)

          def read_zip_metadata(p: Path):
              try:
                  with zipfile.ZipFile(p) as z:
                      bad = z.testzip()
                      if bad:
                          return None, f"corrupt member: {bad}"

                      gradles = [
                          n for n in z.namelist()
                          if n.replace("\\", "/").endswith("/app/build.gradle.kts")
                          or n.replace("\\", "/") == "app/build.gradle.kts"
                      ]
                      if len(gradles) != 1:
                          return None, f"expected exactly one app/build.gradle.kts, got {len(gradles)}"

                      text = z.read(gradles[0]).decode("utf-8")
                      vc = re.search(r'versionCode\s*=\s*(\d+)', text)
                      vn = re.search(r'versionName\s*=\s*"([^"]+)"', text)
                      appid = re.search(r'applicationId\s*=\s*"([^"]+)"', text)
                      if not (vc and vn and appid):
                          return None, "missing version/applicationId metadata"

                      version_code = int(vc.group(1))
                      version_name = vn.group(1)
                      application_id = appid.group(1)
                      if not 1 <= version_code < 2_100_000_000:
                          return None, f"invalid versionCode: {version_code}"
                      if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,79}", version_name):
                          return None, f"unsafe or invalid versionName: {version_name!r}"
                      if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", application_id):
                          return None, f"invalid applicationId: {application_id!r}"

                      return {
                          "version_code": version_code,
                          "version_name": version_name,
                          "application_id": application_id,
                          "gradle_member": gradles[0],
                          "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      }, None
              except Exception as e:
                  return None, str(e)

          # Search the repository, not just root. Exclude transient/build folders.
          candidates = []
          for p in root.rglob("*.zip"):
              parts = set(p.parts)
              if ".git" in parts or "buildsrc" in parts or "build" in parts or "release" in parts:
                  continue
              upper_name = p.name.upper()
              # Accept both production and research GMK mobile source archives.
              # Examples:
              #   GMK_MOBILE_RULE_V0_7_9_....zip
              #   GMK_RESEARCH_MOBILE_RULE_V0_7_22_....zip
              is_research = upper_name.startswith("GMK_RESEARCH_MOBILE_RULE_")
              is_production = upper_name.startswith("GMK_MOBILE_RULE_") and not is_research
              if not (is_production or is_research):
                  continue
              archive_track = "research" if is_research else "production"
              if archive_track != requested_track:
                  print(f"IGNORE {archive_track.upper()} SOURCE ZIP (requested {requested_track.upper()}): {p}")
                  continue
              meta, err = read_zip_metadata(p)
              if meta is None:
                  print(f"ERROR: invalid GMK source ZIP: {p}: {err}")
                  sys.exit(2)
              # Research archives are intentionally buildable in this workflow.
              # Selection is still controlled by the internal versionCode.
              candidates.append((p, meta))

          if candidates:
              max_vc = max(meta["version_code"] for _, meta in candidates)
              highest = [(p, meta) for p, meta in candidates if meta["version_code"] == max_vc]

              # Same versionCode with different bytes is ambiguous and dangerous.
              unique_sha = {meta["sha256"] for _, meta in highest}
              if len(unique_sha) > 1:
                  print("ERROR: multiple different source ZIPs share highest versionCode", max_vc)
                  for p, meta in highest:
                      print(" -", p, meta["version_name"], meta["sha256"])
                  sys.exit(2)

              selected, selected_meta = sorted(highest, key=lambda x: x[0].as_posix())[0]
              print("SELECTED SOURCE ZIP:", selected)
              print("INTERNAL VERSION:", selected_meta["version_code"], selected_meta["version_name"])
              print("SOURCE SHA256:", selected_meta["sha256"])

              with zipfile.ZipFile(selected) as z:
                  safe_extract(z, buildsrc)

              search_root = buildsrc
          else:
              if requested_track == "research":
                  print("ERROR: research track requires a GMK_RESEARCH_MOBILE_RULE_ source ZIP")
                  sys.exit(6)
              selected = None
              selected_meta = None
              search_root = root
              print("NO SOURCE ZIP: attempting extracted Android project in repository")
              print("ZIP FILES FOUND IN REPOSITORY:")
              for z in sorted(root.rglob("*.zip")):
                  if ".git" not in z.parts and "buildsrc" not in z.parts:
                      print(" -", z)

          projects = []
          for settings in list(search_root.rglob("settings.gradle.kts")) + list(search_root.rglob("settings.gradle")):
              project = settings.parent
              if (project / "app" / "build.gradle.kts").is_file():
                  projects.append(project)

          # Deduplicate resolved paths.
          projects = sorted({p.resolve() for p in projects}, key=lambda p: (len(p.parts), p.as_posix()))
          if len(projects) != 1:
              print("ERROR: expected exactly one Android project, found:", [str(p) for p in projects])
              sys.exit(3)

          project = projects[0]
          rel_project = project.relative_to(Path.cwd().resolve()).as_posix()
          if not re.fullmatch(r"[A-Za-z0-9_./-]+", rel_project) or ".." in Path(rel_project).parts:
              print("ERROR: project path contains unsupported characters:", repr(rel_project))
              sys.exit(3)
          print("PROJECT:", rel_project)

          app_gradle = project / "app" / "build.gradle.kts"
          text = app_gradle.read_text(encoding="utf-8")
          def req(pattern, label):
              m = re.search(pattern, text)
              if not m:
                  print("ERROR missing", label)
                  sys.exit(4)
              return m.group(1)

          vc = req(r'versionCode\s*=\s*(\d+)', "versionCode")
          vn = req(r'versionName\s*=\s*"([^"]+)"', "versionName")
          appid = req(r'applicationId\s*=\s*"([^"]+)"', "applicationId")
          if not 1 <= int(vc) < 2_100_000_000:
              print("ERROR: invalid versionCode:", vc)
              sys.exit(4)
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,79}", vn):
              print("ERROR: unsafe or invalid versionName:", repr(vn))
              sys.exit(4)
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", appid):
              print("ERROR: invalid applicationId:", repr(appid))
              sys.exit(4)
          if requested_track == "production" and "research" in vn.lower():
              print("ERROR: research versionName cannot be packaged as production")
              sys.exit(7)

          if selected_meta:
              if (int(vc) != selected_meta["version_code"]
                      or vn != selected_meta["version_name"]
                      or appid != selected_meta["application_id"]):
                  print("ERROR: extracted metadata differs from ZIP metadata")
                  sys.exit(5)

          context = {
              "source_zip": str(selected) if selected else None,
              "source_sha256": selected_meta["sha256"] if selected_meta else None,
              "project_dir": rel_project,
              "version_code": int(vc),
              "version_name": vn,
              "application_id": appid,
              "source_track": requested_track.upper(),
              "git_sha": os.environ.get("GITHUB_SHA", ""),
              "git_ref": os.environ.get("GITHUB_REF", ""),
          }
          Path("build-context.json").write_text(
              json.dumps(context, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(json.dumps(context, ensure_ascii=False, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"project_dir={rel_project}\n")
              f.write(f"version_code={vc}\n")
              f.write(f"version_name={vn}\n")
              f.write(f"application_id={appid}\n")
              f.write(f"source_track={requested_track.upper()}\n")
              if selected:
                  f.write(f"source_zip={selected.as_posix()}\n")
                  f.write(f"source_sha256={selected_meta['sha256']}\n")
          PY2

      - name: Source tree preflight
        shell: bash
        run: |
          set -euo pipefail
          P="${{ steps.locate.outputs.project_dir }}"

          test -f "$P/settings.gradle.kts"
          test -f "$P/build.gradle.kts"
          test -f "$P/app/build.gradle.kts"
          test -f "$P/app/src/main/AndroidManifest.xml"
          test -f "$P/app/src/main/java/jp/gmk/mobile/MainActivity.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/ui/GmkViewModel.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/domain/LocalRuleEngine.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/domain/OneMinuteLocalEngine.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/data/MarketRepository.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/data/HistoryStore.kt"
          test -f "$P/tools/functional_contract_test.py"

          # Guard against accidentally rebuilding the abandoned PC/Ollama 1-minute branch.
          if grep -R -nE 'OneMinuteAiClient|api/generate|127\.0\.0\.1:11434|192\.168\.[0-9]+\.[0-9]+:11434' \
              "$P/app/src/main/java" "$P/app/src/main/res" 2>/dev/null; then
            echo "ERROR: PC/Ollama dependency detected in smartphone-only source"
            exit 10
          fi

          # Known historical compile regression guard.
          grep -Fq 'import androidx.activity.compose.rememberLauncherForActivityResult' \
            "$P/app/src/main/java/jp/gmk/mobile/MainActivity.kt"
          grep -Fq 'JavaVersion.VERSION_17' "$P/app/build.gradle.kts"
          grep -Fq 'jvmTarget = "17"' "$P/app/build.gradle.kts"

          python3 <<'PY3'
          from pathlib import Path
          import re, sys

          project = Path("${{ steps.locate.outputs.project_dir }}")
          source_root = project / "app/src/main/java"
          main = source_root / "jp/gmk/mobile/MainActivity.kt"
          main_text = main.read_text(encoding="utf-8")

          errors = []

          # Kotlin parses $name件 as identifier "name件"; braces are mandatory before Japanese text.
          for source in sorted(source_root.rglob("*.kt")):
              for lineno, line in enumerate(source.read_text(encoding="utf-8").splitlines(), 1):
                  if re.search(r'\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7f]', line):
                      errors.append(f"{source.relative_to(project)}:{lineno}: suspicious Kotlin interpolation: {line.strip()}")

          # Known helper used by History screen must actually exist.
          if "formatJstTime(" in main_text and "private fun formatJstTime(" not in main_text:
              errors.append("formatJstTime is referenced but not defined")

          if errors:
              print("ERROR: Kotlin source preflight failed")
              for e in errors:
                  print(" -", e)
              sys.exit(11)

          print("Kotlin source preflight OK")
          PY3

          echo "Source preflight OK"

      - name: Run source regression contracts
        shell: bash
        run: |
          set -euo pipefail
          P="${{ steps.locate.outputs.project_dir }}"
          python3 "$P/tools/functional_contract_test.py"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import os, sys

          sdk = Path(os.environ.get("ANDROID_SDK_ROOT", os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")))
          preferred = sdk / "cmdline-tools" / "latest" / "bin" / "sdkmanager"

          if preferred.is_file():
              manager = preferred
          else:
              managers = sorted(
                  [p for p in (sdk / "cmdline-tools").rglob("sdkmanager") if p.is_file()],
                  key=lambda p: p.as_posix()
              )
              if not managers:
                  print("ERROR: sdkmanager not found")
                  sys.exit(1)
              manager = managers[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"sdkroot={sdk.as_posix()}\n")
              f.write(f"sdkmanager={manager.as_posix()}\n")

          print("SDK:", sdk)
          print("SDKMANAGER:", manager)
          PY2

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          BT="${{ steps.sdk.outputs.sdkroot }}/build-tools/35.0.0"
          test -x "$BT/apksigner"
          test -x "$BT/aapt"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Toolchain preflight
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "versionCode=${{ steps.locate.outputs.version_code }}"
          echo "versionName=${{ steps.locate.outputs.version_name }}"
          echo "applicationId=${{ steps.locate.outputs.application_id }}"

      - name: Compile Kotlin
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdkroot }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdkroot }}
        run: |
          set -o pipefail

          run_compile() {
            gradle :app:compileDebugKotlin \
              --no-daemon --stacktrace --warning-mode all --console=plain \
              2>&1 | tee "${GITHUB_WORKSPACE}/gradle-compile.log"
          }

          if ! run_compile; then
            if grep -Eqi \
              'Could not resolve|Connection reset|Read timed out|connect timed out|HTTP 50[234]|Temporary failure|Network is unreachable' \
              "${GITHUB_WORKSPACE}/gradle-compile.log"; then
              echo "Transient dependency/network failure detected; retrying once..."
              sleep 5
              gradle :app:compileDebugKotlin \
                --no-daemon --stacktrace --warning-mode all --console=plain --refresh-dependencies \
                2>&1 | tee -a "${GITHUB_WORKSPACE}/gradle-compile.log"
            else
              exit 1
            fi
          fi

      - name: Assemble debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdkroot }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdkroot }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon --stacktrace --warning-mode all --console=plain \
            2>&1 | tee "${GITHUB_WORKSPACE}/gradle-build.log"

      - name: Show actionable build errors
        if: failure()
        shell: bash
        run: |
          set +e
          for F in "${GITHUB_WORKSPACE}/gradle-compile.log" "${GITHUB_WORKSPACE}/gradle-build.log"; do
            if [ -f "$F" ]; then
              echo "========== $F =========="
              grep -nEi \
                '(^e: |error:|FAILURE:|What went wrong|Execution failed|Compilation error|Unresolved reference|Type mismatch|Cannot infer|Expecting|Caused by:|Could not resolve|Manifest merger failed|Duplicate class|AAPT: error)' \
                "$F" | tail -n 900
            fi
          done
          true

      - name: Locate exact APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import os, sys

          project = Path("${{ steps.locate.outputs.project_dir }}")
          preferred = project / "app" / "build" / "outputs" / "apk" / "debug" / "app-debug.apk"

          if preferred.is_file() and preferred.stat().st_size > 0:
              apk = preferred
          else:
              apks = [
                  p for p in (project / "app" / "build" / "outputs").rglob("*.apk")
                  if p.is_file()
                  and p.stat().st_size > 0
                  and "androidTest" not in p.as_posix()
              ]
              if len(apks) != 1:
                  print("ERROR: expected exactly one application APK, found:", [str(x) for x in apks])
                  sys.exit(1)
              apk = apks[0]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"apk_path={apk.as_posix()}\n")
          print("APK:", apk, apk.stat().st_size)
          PY2

      - name: Apply persistent signing key when configured
        id: signing
        if: success()
        shell: bash
        env:
          GMK_SIGNING_KEYSTORE_BASE64: ${{ secrets.GMK_SIGNING_KEYSTORE_BASE64 }}
          GMK_SIGNING_STORE_PASSWORD: ${{ secrets.GMK_SIGNING_STORE_PASSWORD }}
          GMK_SIGNING_KEY_ALIAS: ${{ secrets.GMK_SIGNING_KEY_ALIAS }}
          GMK_SIGNING_KEY_PASSWORD: ${{ secrets.GMK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.apk_path }}"
          BT="${{ steps.sdk.outputs.sdkroot }}/build-tools/35.0.0"

          configured=0
          for value in \
            "$GMK_SIGNING_KEYSTORE_BASE64" \
            "$GMK_SIGNING_STORE_PASSWORD" \
            "$GMK_SIGNING_KEY_ALIAS" \
            "$GMK_SIGNING_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=1; fi
          done

          if [ "$configured" -eq 1 ]; then
            if [ -z "$GMK_SIGNING_KEYSTORE_BASE64" ] \
              || [ -z "$GMK_SIGNING_STORE_PASSWORD" ] \
              || [ -z "$GMK_SIGNING_KEY_ALIAS" ] \
              || [ -z "$GMK_SIGNING_KEY_PASSWORD" ]; then
              echo "ERROR: persistent signing is partially configured; all four GMK_SIGNING_* secrets are required"
              exit 1
            fi
            KEYSTORE="$RUNNER_TEMP/gmk-upload-key.jks"
            printf '%s' "$GMK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            "$BT/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$GMK_SIGNING_KEY_ALIAS" \
              --ks-pass env:GMK_SIGNING_STORE_PASSWORD \
              --key-pass env:GMK_SIGNING_KEY_PASSWORD \
              "$APK"
            python3 - "$KEYSTORE" <<'PY3'
          from pathlib import Path
          import sys
          Path(sys.argv[1]).unlink(missing_ok=True)
          PY3
            echo "signing_mode=persistent" >> "$GITHUB_OUTPUT"
            echo "Persistent signing key applied."
          else
            echo "signing_mode=ephemeral-debug" >> "$GITHUB_OUTPUT"
            echo "WARNING: persistent signing secrets are not configured; this APK uses the runner's debug key and may not update an APK signed by another run."
          fi

      - name: Verify exact APK metadata and signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ steps.sdk.outputs.sdkroot }}/build-tools/35.0.0"
          APK="${{ steps.apk.outputs.apk_path }}"

          test -n "$APK"
          test -s "$APK"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt

          grep -Fq "package: name='${{ steps.locate.outputs.application_id }}'" apk-badging.txt
          grep -Fq "versionCode='${{ steps.locate.outputs.version_code }}'" apk-badging.txt
          grep -Fq "versionName='${{ steps.locate.outputs.version_name }}'" apk-badging.txt
          grep -Fq "sdkVersion:'26'" apk-badging.txt
          grep -Fq "targetSdkVersion:'35'" apk-badging.txt

      - name: Prepare and verify Android install ZIP
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          SAFE_VERSION="$(printf '%s' '${{ steps.locate.outputs.version_name }}' | tr -cd 'A-Za-z0-9._-')"
          BUILD_TRACK="${{ steps.locate.outputs.source_track }}"
          APK_NAME="GMK_MOBILE.apk"
          if [ "$BUILD_TRACK" != "PRODUCTION" ] && [ "$BUILD_TRACK" != "RESEARCH" ]; then
            echo "ERROR: invalid build track: $BUILD_TRACK"
            exit 1
          fi
          INSTALL_ZIP="GMK_MOBILE_INSTALL_${BUILD_TRACK}_V${SAFE_VERSION}.zip"

          cp "${{ steps.apk.outputs.apk_path }}" "release/$APK_NAME"
          cp build-context.json release/build-context.json
          cp apk-badging.txt release/apk-badging.txt
          cp apk-signature.txt release/apk-signature.txt

          cat > release/インストール手順.txt <<'EOF'
          GMK Android アプリのインストール手順

          1. このZIPをAndroid端末に保存して展開します。
          2. 展開した GMK_MOBILE.apk をタップします。
          3. Androidが許可を求めた場合は、利用中のファイルアプリに「不明なアプリのインストール」を許可します。
          4. インストーラーの案内に従ってインストールします。

          更新時も同じ手順でAPKを開きます。既存アプリと署名が異なる場合、Androidは上書きを拒否します。
          EOF

          if [ '${{ steps.signing.outputs.signing_mode }}' = 'ephemeral-debug' ]; then
            cat >> release/インストール手順.txt <<'EOF'

          このCIには永続署名鍵が設定されていないため、このAPKは実行ごとに異なるdebug署名になる場合があります。
          上書きインストールが拒否された場合、アンインストール前に必要な端末内データを保存してください。
          EOF
          fi

          if [ "$BUILD_TRACK" = "RESEARCH" ]; then
            cat >> release/インストール手順.txt <<'EOF'

          RESEARCH_ONLY: 研究トラックのAPKです。研究データ由来の結果を独立したOOS/本番成績として扱わないでください。
          EOF
          fi

          cat > release/診断ログ説明.txt <<'EOF'
          診断ログについて

          アプリの「状態」画面から診断ログを出力できます。
          ログには取得元・レート時刻・鮮度・スキャン候補・ENTRY/判定・勝敗・チャート同期・通貨強弱同期・警告/エラーの情報が含まれます。
          不具合の調査時は、発生時刻と操作内容を添えてログを共有してください。
          EOF

          printf '%s\n' "$BUILD_TRACK" > release/build-track.txt
          printf '%s\n' '${{ steps.signing.outputs.signing_mode }}' > release/signing-mode.txt

          python3 - "$INSTALL_ZIP" <<'PY3'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, shutil, sys

          release = Path("release")
          staging = release / ".install-package"
          staging.mkdir(exist_ok=True)
          names = ["GMK_MOBILE.apk", "インストール手順.txt", "SHA256.txt", "診断ログ説明.txt"]
          shutil.copy2(release / "GMK_MOBILE.apk", staging / "GMK_MOBILE.apk")
          (staging / "インストール手順.txt").write_bytes((release / "インストール手順.txt").read_bytes())
          (staging / "診断ログ説明.txt").write_bytes((release / "診断ログ説明.txt").read_bytes())
          digest = hashlib.sha256((staging / "GMK_MOBILE.apk").read_bytes()).hexdigest()
          (staging / "SHA256.txt").write_text(f"{digest}  GMK_MOBILE.apk\n", encoding="utf-8")
          (release / "SHA256.txt").write_text(f"{digest}  GMK_MOBILE.apk\n", encoding="utf-8")

          package = release / sys.argv[1]
          with ZipFile(package, "w", compression=ZIP_DEFLATED) as zf:
              for name in names:
                  zf.write(staging / name, arcname=name)
          with ZipFile(package) as zf:
              if sorted(zf.namelist()) != sorted(names) or zf.testzip() is not None:
                  raise SystemExit("Install ZIP contents/integrity check failed")
              if hashlib.sha256(zf.read("GMK_MOBILE.apk")).hexdigest() != digest:
                  raise SystemExit("APK SHA-256 inside install ZIP does not match")
          shutil.rmtree(staging)
          print("Verified install ZIP:", package, "SHA256:", digest)
          PY3

          test -s "release/$INSTALL_ZIP"

      - name: Upload install ZIP and build evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_INSTALL_${{ steps.locate.outputs.source_track }}_${{ steps.locate.outputs.version_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prepare failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p failure-diagnostics
          cp build-context.json failure-diagnostics/ 2>/dev/null || true
          cp gradle-compile.log failure-diagnostics/ 2>/dev/null || true
          cp gradle-build.log failure-diagnostics/ 2>/dev/null || true
          cp apk-badging.txt failure-diagnostics/ 2>/dev/null || true
          cp apk-signature.txt failure-diagnostics/ 2>/dev/null || true

          P="${{ steps.locate.outputs.project_dir }}"
          if [ -n "$P" ] && [ -d "$P/app/build/reports" ]; then
            cp -R "$P/app/build/reports" failure-diagnostics/app-build-reports
          fi

          {
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > failure-diagnostics/runner-context.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_RULE_BUILD_FAILURE_${{ github.run_id }}_${{ github.run_attempt }}
          path: failure-diagnostics/**
          if-no-files-found: warn
          retention-days: 14
