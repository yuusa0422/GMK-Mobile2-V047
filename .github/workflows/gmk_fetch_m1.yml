name: GMK fetch 1-minute candles
# 手動実行: Actions → "GMK fetch 1-minute candles" → Run workflow
# 取得元ごとに別ステップ・別の制限時間で動きます。1つが失敗/遅延しても他は続行し、取れた分は必ず保存されます。
# 取得元: Yahoo Finance(アプリと同じ為替) / bitbank(アプリと同じBTC、土日も取得) / Dukascopy(照合用の為替BID)
# 注意: Yahooの1分足は「直近30日」までしか取得できません。
on:
  workflow_dispatch:
    inputs:
      start_date: {description: '開始日 JST (YYYY-MM-DD)', required: true, default: '2026-10-01'}
      end_date: {description: '終了日 JST (YYYY-MM-DD, この日を含む)', required: true, default: '2026-10-22'}
permissions: {contents: read}
env:
  START_DATE: ${{ inputs.start_date }}
  END_DATE: ${{ inputs.end_date }}
  PYTHONUNBUFFERED: '1'
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Write fetch script
        run: |
          cat > fetch_m1.py <<'PY'
          import csv, datetime as dt, hashlib, json, lzma, os, struct, sys, time, urllib.error, urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo
 
          SOURCE = sys.argv[1]
          BUDGET = float(sys.argv[2]) * 60          # seconds this source may use
          T_START = time.monotonic()
          JST = ZoneInfo('Asia/Tokyo'); UTC = dt.timezone.utc
          start = dt.date.fromisoformat(os.environ['START_DATE']); end = dt.date.fromisoformat(os.environ['END_DATE'])
          OUT = Path('gmk_m1'); OUT.mkdir(exist_ok=True)
          YAHOO = {'USDJPY': 'JPY=X', 'EURJPY': 'EURJPY=X', 'GBPJPY': 'GBPJPY=X', 'AUDJPY': 'AUDJPY=X', 'NZDJPY': 'NZDJPY=X'}
          FX = list(YAHOO)
          # JST range [start 00:00, end+1 05:30): every 09:00 -> 05:00 session plus the 06:00-09:00 history.
          t0 = dt.datetime.combine(start, dt.time(0), JST)
          t1 = min(dt.datetime.combine(end + dt.timedelta(days=1), dt.time(5, 30), JST), dt.datetime.now(JST))
          report = {'source': SOURCE, 'start_jst': str(start), 'end_jst': str(end), 'files': {}, 'errors': [], 'coverage': {},
                    'requests': 0, 'budget_exhausted': False}
 
          def log(*a): print(f'[{SOURCE} {time.monotonic() - T_START:6.0f}s]', *a, flush=True)
          def out_of_time(): return time.monotonic() - T_START > BUDGET
 
          def get(url, binary=False, attempts=3, timeout=20):
              last = None
              for k in range(attempts):
                  if out_of_time(): raise RuntimeError('time budget exhausted')
                  report['requests'] += 1
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': '*/*'})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read()
                      return data if binary else data.decode('utf-8')
                  except urllib.error.HTTPError as e:
                      last = f'HTTP {e.code}'
                      if e.code == 404: return None
                  except Exception as e:
                      last = f'{type(e).__name__}: {e}'
                  log('retry', k + 1, last, url[:120])
                  time.sleep(3 * (k + 1))
              raise RuntimeError(f'{last} ({url[:160]})')
 
          def ok(o, h, l, c):
              return all(x is not None and x == x and x > 0 for x in (o, h, l, c)) and h >= max(o, c) and l <= min(o, c)
 
          def write(symbol, rows, suffix='1m_JST'):
              rows = sorted({r[0]: r for r in rows if t0.timestamp() * 1000 <= r[0] < t1.timestamp() * 1000}.values())
              path = OUT / SOURCE / f'{symbol}_{suffix}.csv'; path.parent.mkdir(exist_ok=True)
              with path.open('w', newline='') as f:
                  w = csv.writer(f); w.writerow(['time_jst', 'epoch_ms', 'open', 'high', 'low', 'close', 'volume'])
                  for ms, o, h, l, c, v in rows:
                      w.writerow([dt.datetime.fromtimestamp(ms / 1000, JST).isoformat(), ms, repr(o), repr(h), repr(l), repr(c), repr(v)])
              report['files'][str(path.relative_to(OUT))] = {'rows': len(rows), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
              cov = {}; day = start
              while day <= end:  # app session 09:00 -> next day 05:00 (1200 min); FX sessions start Mon-Fri only
                  if symbol == 'BTCJPY' or day.weekday() < 5:
                      a = dt.datetime.combine(day, dt.time(9), JST).timestamp() * 1000
                      b = dt.datetime.combine(day + dt.timedelta(days=1), dt.time(5), JST).timestamp() * 1000
                      cov[str(day)] = {'weekday': day.strftime('%a'), 'bars_session_09_05': sum(1 for r in rows if a <= r[0] < b), 'expected': 1200}
                  day += dt.timedelta(days=1)
              report['coverage'][symbol] = cov
              log(f'{symbol}: {len(rows)} bars saved')
              save_report()
 
          def save_report():
              (OUT / f'report_{SOURCE}.json').write_text(json.dumps(report, ensure_ascii=False, indent=1) + '\n')
 
          try:
              if SOURCE == 'yahoo':
                  for sym, ys in YAHOO.items():
                      rows = []; p = t0
                      while p < t1 and not out_of_time():
                          q = min(p + dt.timedelta(days=5), t1)  # Yahoo serves at most ~7 days of 1m per request
                          err = None
                          for host in ('query1.finance.yahoo.com', 'query2.finance.yahoo.com'):
                              url = (f'https://{host}/v8/finance/chart/{ys}?interval=1m&includePrePost=true'
                                     f'&events=history&period1={int(p.timestamp())}&period2={int(q.timestamp())}')
                              try:
                                  j = json.loads(get(url) or '{}')
                                  e = (j.get('chart') or {}).get('error')
                                  if e: raise RuntimeError(json.dumps(e, ensure_ascii=False)[:300])
                                  res = ((j.get('chart') or {}).get('result') or [None])[0] or {}
                                  ts = res.get('timestamp') or []
                                  qd = ((res.get('indicators') or {}).get('quote') or [{}])[0]
                                  n0 = len(rows)
                                  for i, t in enumerate(ts):
                                      vals = [(qd.get(k) or [None] * len(ts))[i] for k in ('open', 'high', 'low', 'close')]
                                      vol = (qd.get('volume') or [0] * len(ts))[i] or 0
                                      if ok(*vals) and t % 60 == 0: rows.append((t * 1000, *[float(x) for x in vals], float(vol)))
                                  log(sym, p.date(), '->', q.date(), f'+{len(rows) - n0} bars via {host}')
                                  err = None; break
                              except Exception as e:
                                  err = str(e)[:400]
                          if err: report['errors'].append({'symbol': sym, 'from': p.isoformat(), 'to': q.isoformat(), 'error': err}); log('ERROR', sym, err)
                          p = q; time.sleep(1.0)
                      write(sym, rows)
 
              elif SOURCE == 'bitbank':
                  rows = []; day = start
                  while day <= t1.date() and not out_of_time():  # every calendar day incl. weekends
                      try:
                          j = json.loads(get(f'https://public.bitbank.cc/btc_jpy/candlestick/1min/{day:%Y%m%d}') or '{}')
                          n0 = len(rows)
                          for g in ((j.get('data') or {}).get('candlestick') or []):
                              for a in g.get('ohlcv') or []:
                                  o, h, l, c, v, ms = float(a[0]), float(a[1]), float(a[2]), float(a[3]), float(a[4]), int(a[5])
                                  if ok(o, h, l, c): rows.append((ms, o, h, l, c, v))
                          log(day, f'+{len(rows) - n0} bars')
                      except Exception as e:
                          report['errors'].append({'date': str(day), 'error': str(e)[:400]}); log('ERROR', day, e)
                      day += dt.timedelta(days=1); time.sleep(0.5)
                  write('BTCJPY', rows)
 
              elif SOURCE == 'dukascopy':
                  yahoo_ref = {}
                  for sym in FX:
                      rows = []; scale = None; day = t0.astimezone(UTC).date()
                      while day <= t1.astimezone(UTC).date() and not out_of_time():
                          if day.weekday() == 5:  # Saturday UTC: market closed
                              day += dt.timedelta(days=1); continue
                          # month is zero-based; record = int32 sec-of-day, open, close, low, high (scaled), float32 volume
                          url = f'https://datafeed.dukascopy.com/datafeed/{sym}/{day.year}/{day.month - 1:02d}/{day.day:02d}/BID_candles_min_1.bi5'
                          try:
                              raw = get(url, binary=True)
                              n0 = len(rows)
                              if raw:
                                  data = lzma.decompress(raw)
                                  base = dt.datetime.combine(day, dt.time(0), UTC).timestamp()
                                  for k in range(0, len(data) - 23, 24):
                                      sec, o, c, l, h, v = struct.unpack('>5if', data[k:k + 24])
                                      if scale is None: scale = 1000.0 if 50 < o / 1000.0 < 500 else 100000.0
                                      vals = (o / scale, h / scale, l / scale, c / scale)
                                      if 0 <= sec < 86400 and v > 0 and ok(*vals):
                                          rows.append((int((base + sec) * 1000), *vals, float(v)))
                              log(sym, day, f'+{len(rows) - n0} bars')
                          except Exception as e:
                              report['errors'].append({'symbol': sym, 'date': str(day), 'error': str(e)[:400]}); log('ERROR', sym, day, e)
                          day += dt.timedelta(days=1); time.sleep(0.2)
                      write(sym, rows, 'BID_1m_JST')
          finally:
              report['budget_exhausted'] = out_of_time()
              save_report()
              log('done', json.dumps({k: v['rows'] for k, v in report['files'].items()}), 'errors', len(report['errors']))
          PY
      - name: Fetch Yahoo (FX, same source as the app)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 fetch_m1.py yahoo 12
      - name: Fetch bitbank (BTC, includes weekends)
        continue-on-error: true
        timeout-minutes: 10
        run: python3 fetch_m1.py bitbank 8
      - name: Fetch Dukascopy (FX BID, cross-check)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 fetch_m1.py dukascopy 17
      - name: Summary
        if: always()
        run: |
          ls -R gmk_m1 || true
          for f in gmk_m1/report_*.json; do echo "== $f"; python3 -c "import json,sys;r=json.load(open(sys.argv[1]));print({k:v['rows'] for k,v in r['files'].items()}, 'errors:', len(r['errors']), 'budget_exhausted:', r['budget_exhausted']); [print(' ', e) for e in r['errors'][:5]]" "$f"; done
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: GMK_M1_${{ inputs.start_date }}_${{ inputs.end_date }}
          path: gmk_m1/
          if-no-files-found: warn
 
