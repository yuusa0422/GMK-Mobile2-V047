name: Build GMK Historical Data V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify downloader ZIP exists
        shell: bash
        run: |
          set -euo pipefail
          test -f GMK_HISTORY_DOWNLOADER_CORE.zip || {
            echo "ERROR: GMK_HISTORY_DOWNLOADER_CORE.zip was not found in repository root."
            exit 1
          }

      - name: Extract downloader ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _gmk_run
          mkdir -p _gmk_run
          unzip -q GMK_HISTORY_DOWNLOADER_CORE.zip -d _gmk_run
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/download_gmk_history.py
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/requirements.txt
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/config.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r _gmk_run/GMK_HISTORY_DOWNLOADER/requirements.txt

      - name: Download build and fully validate GMK data
        shell: bash
        run: |
          set -euo pipefail
          cd _gmk_run/GMK_HISTORY_DOWNLOADER
          python download_gmk_history.py

      - name: Show validation report
        if: always()
        shell: bash
        run: |
          echo "Generated files:"
          find _gmk_run/GMK_HISTORY_DOWNLOADER/output -maxdepth 4 -type f -print | sort || true
          if [ -f _gmk_run/GMK_HISTORY_DOWNLOADER/output/validation_errors.txt ]; then
            echo "--- validation_errors.txt ---"
            cat _gmk_run/GMK_HISTORY_DOWNLOADER/output/validation_errors.txt
          fi
          if [ -f _gmk_run/GMK_HISTORY_DOWNLOADER/output/missing_minutes.csv ]; then
            echo "--- first 100 missing minutes ---"
            head -101 _gmk_run/GMK_HISTORY_DOWNLOADER/output/missing_minutes.csv
          fi

      - name: Verify full validation passed
        shell: bash
        run: |
          set -euo pipefail
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/output/validation_OK.txt
          test ! -f _gmk_run/GMK_HISTORY_DOWNLOADER/output/validation_errors.txt
          test ! -f _gmk_run/GMK_HISTORY_DOWNLOADER/output/missing_minutes.csv
          grep -q "FULL VALIDATION PASSED" _gmk_run/GMK_HISTORY_DOWNLOADER/output/validation_OK.txt

      - name: Upload GMK historical data
        uses: actions/upload-artifact@v4
        with:
          name: GMK_HISTORY_20260901_20261006
          path: _gmk_run/GMK_HISTORY_DOWNLOADER/output/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
