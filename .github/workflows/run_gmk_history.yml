name: Build GMK Historical Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify downloader ZIP exists
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root:"
          pwd
          echo "Repository files:"
          ls -la
          test -f GMK_HISTORY_DOWNLOADER_CORE.zip || {
            echo "ERROR: GMK_HISTORY_DOWNLOADER_CORE.zip was not found in the repository root."
            exit 1
          }

      - name: Extract downloader ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _gmk_run
          mkdir -p _gmk_run
          unzip -q GMK_HISTORY_DOWNLOADER_CORE.zip -d _gmk_run
          echo "Extracted files:"
          find _gmk_run -maxdepth 3 -type f -print | sort
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/download_gmk_history.py
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/requirements.txt
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/config.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r _gmk_run/GMK_HISTORY_DOWNLOADER/requirements.txt

      - name: Download and build GMK data
        id: download
        shell: bash
        run: |
          set -euo pipefail
          cd _gmk_run/GMK_HISTORY_DOWNLOADER
          python download_gmk_history.py

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "Generated files:"
          find _gmk_run/GMK_HISTORY_DOWNLOADER -maxdepth 4 -type f -print | sort || true

      - name: Verify output ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/GMK_HISTORY_20260901_20261006.zip || {
            echo "ERROR: Output ZIP was not generated."
            if [ -f _gmk_run/GMK_HISTORY_DOWNLOADER/output/failures.txt ]; then
              echo "--- failures.txt ---"
              cat _gmk_run/GMK_HISTORY_DOWNLOADER/output/failures.txt
            fi
            exit 1
          }
          ls -lh _gmk_run/GMK_HISTORY_DOWNLOADER/GMK_HISTORY_20260901_20261006.zip

      - name: Upload GMK historical data
        uses: actions/upload-artifact@v4
        with:
          name: GMK_HISTORY_20260901_20261006
          path: |
            _gmk_run/GMK_HISTORY_DOWNLOADER/GMK_HISTORY_20260901_20261006.zip
            _gmk_run/GMK_HISTORY_DOWNLOADER/output/**
          if-no-files-found: error
          retention-days: 30
