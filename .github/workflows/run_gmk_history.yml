name: Build GMK Historical Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Extract downloader ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f GMK_HISTORY_DOWNLOADER_CORE.zip
          rm -rf _gmk_run
          mkdir _gmk_run
          unzip -q GMK_HISTORY_DOWNLOADER_CORE.zip -d _gmk_run
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/download_gmk_history.py
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/requirements.txt
          test -f _gmk_run/GMK_HISTORY_DOWNLOADER/config.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r _gmk_run/GMK_HISTORY_DOWNLOADER/requirements.txt

      - name: Download and build GMK data
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd _gmk_run/GMK_HISTORY_DOWNLOADER
          python download_gmk_history.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          find _gmk_run/GMK_HISTORY_DOWNLOADER -maxdepth 3 -type f -print | sort

      - name: Upload GMK historical data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GMK_HISTORY_20260901_20261006
          path: |
            _gmk_run/GMK_HISTORY_DOWNLOADER/GMK_HISTORY_20260901_20261006.zip
            _gmk_run/GMK_HISTORY_DOWNLOADER/output/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail if downloader reported an error
        if: always() && steps.download.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Downloader returned exit code ${{ steps.download.outputs.exit_code }}. Artifact was uploaded for inspection."
          exit 1
