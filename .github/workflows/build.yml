name: Build GMK APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Extract
        run: |
          unzip -q GMK_RESEARCH_MOBILE_RULE_V0_7_28_CROSS_FUNCTION_AUDIT_20260924.zip -d src
          rm -rf src/.github

      - name: Build
        working-directory: src
        run: gradle --no-daemon :app:compileDebugKotlin :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GMK-v0.7.28-APK
          path: src/app/build/outputs/apk/debug/*.apk
