name: Build GMK Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir buildsrc
          unzip -q GMK_RESEARCH_MOBILE_RULE_V0_7_28_CROSS_FUNCTION_AUDIT_20260924.zip -d buildsrc

      - name: Build
        working-directory: buildsrc
        run: |
          gradle --no-daemon :app:compileDebugKotlin
          gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GMK-v0.7.28-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
