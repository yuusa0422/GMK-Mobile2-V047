name: GMK Mobile v0.7.79
on: [workflow_dispatch]
permissions: {contents: read}
concurrency: {group: 'gmk-${{ github.ref }}', cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.GMK_SIGNING_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.GMK_SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.GMK_SIGNING_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.GMK_SIGNING_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.GMK_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare source and verify inputs
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, zipfile
          root = pathlib.Path.cwd()
          helpers = [p for p in root.rglob('tools/build_release.py') if '.git' not in p.parts]
          stem = 'GMK_MOBILE_V0779_AUDIT2_20261106'
          archives = [p for p in root.rglob(stem + '*.zip') if '.git' not in p.parts and re.fullmatch(re.escape(stem) + r'(?: ?\([0-9]+\))*\.zip', p.name)]
          if len(archives) == 1 and not helpers:
              with zipfile.ZipFile(archives[0]) as z:
                  items = [i for i in z.infolist() if i.filename.endswith('/tools/build_release.py')]
                  if len(items) != 1 or items[0].file_size > 1000000: raise SystemExit('ERROR: invalid source helper')
                  helper = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gmk-build_release.py'
                  helper.write_bytes(z.read(items[0]))
          elif len(helpers) == 1 and not archives:
              helper = helpers[0]
          else: raise SystemExit('ERROR: keep one v0.7.79 source ZIP or one extracted project')
          subprocess.run(['python3', str(helper), 'prepare'], check=True)
          PY
      - uses: actions/setup-java@v6.0.1
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4.0.4
        with: {cmdline-tools-version: '12266719', packages: 'platform-tools platforms;android-35 build-tools;35.0.0'}
      - uses: gradle/actions/setup-gradle@v5.0.2
        with: {gradle-version: '8.10.2'}
      - name: Test, build and verify APK
        run: |
          set -euo pipefail
          python3 "$GMK_PROJECT/tools/build_release.py" build
          python3 "$GMK_PROJECT/tools/build_release.py" package
      - name: Crypto price sources answer (Coinbase main, Binance backup; the app's requests)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python3 - <<'PY' | tee artifacts/crypto-live-probe.txt
          import json, time, urllib.request
          def get(u):
              t = time.time()
              with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'GMK-Mobile/0.7.79', 'Accept': 'application/json'}), timeout=10) as r:
                  return json.loads(r.read()), round((time.time() - t) * 1000)
          now = int(time.time()); s = now - 130 * 60
          for p, b in (('BTC-USD', 'BTCUSDT'), ('ETH-USD', 'ETHUSDT')):
              for name, url, read in (
                  ('Coinbase ticker', f'https://api.exchange.coinbase.com/products/{p}/ticker', lambda j: f"price {j['price']} time {j['time']}"),
                  ('Coinbase 1m', f'https://api.exchange.coinbase.com/products/{p}/candles?granularity=60&start={time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(s))}&end={time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now))}', lambda j: f"{len(j)} candles, newest {j[0][0]}"),
                  ('Binance trade', f'https://data-api.binance.vision/api/v3/trades?symbol={b}&limit=1', lambda j: f"price {j[0]['price']} age {now * 1000 - j[0]['time']} ms"),
                  ('Binance 1m', f'https://data-api.binance.vision/api/v3/klines?symbol={b}&interval=1m&startTime={s * 1000}&endTime={now * 1000}&limit=1000', lambda j: f"{len(j)} candles, newest {j[-1][0] // 1000}")):
                  try:
                      j, ms = get(url); print(f'OK   {p:8s} {name:15s} {ms:5d} ms  {read(j)}')
                  except Exception as e:
                      print(f'FAIL {p:8s} {name:15s} {type(e).__name__}: {str(e)[:120]}')
          PY
      - uses: actions/upload-artifact@v6.0.0
        with: {name: GMK_MOBILE_V0779_APK, path: artifacts/, if-no-files-found: error}
      - uses: actions/upload-artifact@v6.0.0
        if: failure()
        with: {name: GMK-build-diagnostics, path: "gradle-build.log\nbuild-environment.log\n${{ env.GMK_PROJECT }}/app/build/reports/\n${{ env.GMK_PROJECT }}/app/build/test-results/", if-no-files-found: ignore}
 
