name: Build GMK APK
on: [push, workflow_dispatch]
permissions: {contents: read}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - id: src
        name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          Z=$(find . -maxdepth 1 -name 'GMK_MOBILE_RULE_*.zip' ! -name '*RESEARCH*' | sort -V | tail -1)
          test -n "$Z"
          rm -rf buildsrc && mkdir buildsrc && unzip -q "$Z" -d buildsrc
          P=$(dirname "$(find buildsrc -name settings.gradle.kts -print -quit)")
          test -f "$P/app/build.gradle.kts"
          echo "dir=$P" >> "$GITHUB_OUTPUT"

      - name: Test
        run: python3 "${{ steps.src.outputs.dir }}/tools/functional_contract_test.py"

      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.9'}

      - name: Build
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          gradle :app:assembleDebug --no-daemon
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: GMK-MOBILE-APK
          path: |
            ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.src.outputs.dir }}/app-debug.apk.sha256
