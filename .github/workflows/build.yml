name: Build GMK Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest source and locate project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import zipfile, os, sys, shutil, re, hashlib

          def find_project(root: Path):
              for s in list(root.rglob("settings.gradle.kts")) + list(root.rglob("settings.gradle")):
                  p = s.parent
                  if (p/"app"/"build.gradle.kts").is_file() or (p/"app"/"build.gradle").is_file():
                      return p
              return None

          def version_key(p: Path):
              m = re.search(r'V(\d+)[._-](\d+)[._-](\d+)', p.name, re.I)
              if m:
                  return tuple(map(int, m.groups()))
              m = re.search(r'V(\d+)[._-](\d+)', p.name, re.I)
              if m:
                  a,b = map(int,m.groups()); return (a,b,0)
              return (-1,-1,-1)

          def safe_extract(zf: zipfile.ZipFile, destination: Path):
              root = destination.resolve()
              for info in zf.infolist():
                  target = (destination / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError('Unsafe ZIP path: ' + info.filename)
              zf.extractall(destination)

          root = Path('.')
          zips = [p for p in root.glob('*.zip')
                  if p.is_file() and p.name.upper().startswith('GMK_MOBILE_RULE_')]

          if zips:
              selected = max(zips, key=lambda p: (version_key(p), p.name))
              digest = hashlib.sha256(selected.read_bytes()).hexdigest()
              print('SELECTED ZIP:', selected)
              print('VERSION KEY:', version_key(selected))
              print('SOURCE SHA256:', digest)
              shutil.rmtree('buildsrc', ignore_errors=True)
              Path('buildsrc').mkdir()
              with zipfile.ZipFile(selected) as z:
                  bad = z.testzip()
                  if bad:
                      print('ERROR corrupt ZIP:', bad); sys.exit(1)
                  safe_extract(z, Path('buildsrc'))
              project = find_project(Path('buildsrc'))
          else:
              selected = None
              project = find_project(root)

          if project is None:
              print('ERROR: Android project not found'); sys.exit(1)

          print('PROJECT:', project)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('project_dir=' + project.as_posix() + '\n')
              if selected:
                  f.write('source_zip=' + selected.as_posix() + '\n')
          PY2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import os, sys
          sdk = Path(os.environ.get('ANDROID_SDK_ROOT', os.environ.get('ANDROID_HOME', '/usr/local/lib/android/sdk')))
          managers = [p for p in (sdk/'cmdline-tools').rglob('sdkmanager') if p.is_file()]
          if not managers:
              print('ERROR: sdkmanager not found'); sys.exit(1)
          manager = sorted(managers)[-1]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('sdkroot=' + sdk.as_posix() + '\n')
              f.write('sdkmanager=' + manager.as_posix() + '\n')
          print('SDK:', sdk)
          print('SDKMANAGER:', manager)
          PY2

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read source metadata and audit JVM
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import re, os, sys
          p = Path("${{ steps.locate.outputs.project_dir }}/app/build.gradle.kts")
          s = p.read_text(encoding='utf-8')
          for x in ['JavaVersion.VERSION_17', 'jvmTarget = "17"']:
              if x not in s:
                  print('ERROR missing:', x); sys.exit(1)
          def req(pattern, label):
              m = re.search(pattern, s)
              if not m:
                  print('ERROR missing', label); sys.exit(1)
              return m.group(1)
          vc = req(r'versionCode\s*=\s*(\d+)', 'versionCode')
          vn = req(r'versionName\s*=\s*"([^"]+)"', 'versionName')
          appid = req(r'applicationId\s*=\s*"([^"]+)"', 'applicationId')
          print('SOURCE:', appid, vc, vn)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('version_code=' + vc + '\n')
              f.write('version_name=' + vn + '\n')
              f.write('application_id=' + appid + '\n')
          PY2

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdkroot }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdkroot }}
        run: |
          set -o pipefail
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all \
            2>&1 | tee "${GITHUB_WORKSPACE}/gradle-build.log"

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          if [ -f "${GITHUB_WORKSPACE}/gradle-build.log" ]; then
            grep -nEi '(^e: |error:|FAILURE:|What went wrong|Execution failed|Compilation error|Unresolved reference|Type mismatch|Cannot infer|Expecting|Caused by:|Could not resolve|Manifest merger failed)' \
              "${GITHUB_WORKSPACE}/gradle-build.log" | tail -n 700 || true
          fi

      - name: Locate and verify exact APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import os, sys
          project = Path("${{ steps.locate.outputs.project_dir }}")
          preferred = project/'app/build/outputs/apk/debug/app-debug.apk'
          if preferred.is_file() and preferred.stat().st_size > 0:
              apk = preferred
          else:
              apks = [p for p in (project/'app/build/outputs').rglob('*.apk')
                      if p.is_file() and p.stat().st_size > 0 and 'androidTest' not in str(p)]
              if len(apks) != 1:
                  print('ERROR: expected one application APK, found', [str(x) for x in apks]); sys.exit(1)
              apk = apks[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('apk_path=' + apk.as_posix() + '\n')
          print('APK:', apk, apk.stat().st_size)
          PY2

          BT="${{ steps.sdk.outputs.sdkroot }}/build-tools/35.0.0"
          APK="${{ steps.apk.outputs.apk_path }}"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "package: name='${{ steps.meta.outputs.application_id }}'" apk-badging.txt
          grep -Fq "versionCode='${{ steps.meta.outputs.version_code }}'" apk-badging.txt
          grep -Fq "versionName='${{ steps.meta.outputs.version_name }}'" apk-badging.txt

      - name: Prepare release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          NAME="GMK_MOBILE_RULE_V${{ steps.meta.outputs.version_name }}.apk"
          cp "${{ steps.apk.outputs.apk_path }}" "release/$NAME"
          sha256sum "release/$NAME" > "release/$NAME.sha256"
          cat "release/$NAME.sha256"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_RULE_${{ steps.meta.outputs.version_name }}_APK
          path: release/*
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_RULE_BUILD_FAILURE
          path: |
            gradle-build.log
            apk-badging.txt
            **/app/build/reports/**
          if-no-files-found: warn
          retention-days: 7
