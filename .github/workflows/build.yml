name: Build GMK Mobile v0.7.33
on: [workflow_dispatch, push]
permissions: {contents: read}
concurrency: {group: 'gmk-android-${{ github.ref }}', cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          zips = sorted(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() == ".zip" and ".git" not in p.parts)
          print("Repository ZIPs:", [str(p.relative_to(root)) for p in zips], flush=True)
          def matches(stem):
              return [p for p in zips if re.fullmatch(re.escape(stem) + r"(?:[ _-]?\([0-9-]+\)|[ _-][0-9-]+)?", p.stem, re.I)]
          archives = matches("GMK_MOBILE_V0733_AUDITED_SOURCE_20261001")
          if len(archives) > 1:
              raise SystemExit("ERROR: multiple production ZIPs; keep exactly one")
          if archives:
              data = matches("GMK_V0733_TEST_DATA")
              if len(data) != 1:
                  raise SystemExit("ERROR: upload exactly one GMK_V0733_TEST_DATA.zip beside the source ZIP")
              archives += data
              root = Path(tempfile.mkdtemp(prefix="gmk-", dir=os.environ["RUNNER_TEMP"]))
              seen = set()
              for archive in archives:
                  with zipfile.ZipFile(archive) as z:
                      if sum(i.file_size for i in z.infolist()) > 256 * 1024 * 1024:
                          raise SystemExit("ERROR: source ZIP exceeds 256 MiB")
                      for i in z.infolist():
                          p = PurePosixPath(i.filename.replace("\\", "/"))
                          if not p.parts or p.is_absolute() or ".." in p.parts or ":" in str(p):
                              raise SystemExit("ERROR: unsafe ZIP path")
                          if str(p) in seen:
                              raise SystemExit("ERROR: duplicate ZIP target")
                          seen.add(str(p))
                          if (i.external_attr >> 16) & 0o170000 not in (0, 0o100000, 0o040000):
                              raise SystemExit("ERROR: links and special ZIP entries are forbidden")
                          target = root.joinpath(*p.parts)
                          if i.is_dir():
                              target.mkdir(parents=True, exist_ok=True)
                          else:
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(z.read(i))
          projects = [p.parent for p in root.rglob("settings.gradle.kts") if ".git" not in p.parts and (p.parent / "app/build.gradle.kts").is_file()]
          if len(projects) != 1:
              raise SystemExit(f"ERROR: found {len(projects)} Android projects. Upload the v0.7.33 source ZIP AND test-data ZIP to this branch, then Run workflow. Check Repository ZIPs above.")
          project = projects[0].resolve()
          metadata = (project / "app/build.gradle.kts").read_text()
          expected = {"applicationId": '"jp.gmk.mobile.rule"', "versionCode": "103", "versionName": '"0.7.33-production-audited"'}
          if any(not re.search(rf"^\s*{key}\s*=\s*{re.escape(value)}\s*$", metadata, re.M) for key, value in expected.items()):
              raise SystemExit("ERROR: wrong applicationId or production version")
          if any(c in str(project) for c in "\r\n"):
              raise SystemExit("ERROR: invalid project path")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GMK_PROJECT={project}\n")
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GMK_PROJECT"
          sha256sum --check --quiet PACKAGE_MANIFEST_SHA256.txt
          python3 tools/functional_contract_test.py
          python3 tools/horizon_release_audit.py
          gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace --console=plain | tee "$GITHUB_WORKSPACE/gradle-build.log"
      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GMK_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GMK_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GMK_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GMK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$GMK_PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [[ -n "$KEYSTORE_B64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            : "${KEYSTORE_B64:?Missing keystore}" "${STORE_PASSWORD:?Missing store password}" "${KEY_ALIAS:?Missing key alias}" "${KEY_PASSWORD:?Missing key password}"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gmk.keystore"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/gmk.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out artifacts/GMK_MOBILE.apk "$APK"
            echo persistent > artifacts/signing-mode.txt
          else
            cp "$APK" artifacts/GMK_MOBILE.apk
            echo ephemeral-debug > artifacts/signing-mode.txt
          fi
          "$BT/apksigner" verify --verbose artifacts/GMK_MOBILE.apk
          "$BT/aapt" dump badging artifacts/GMK_MOBILE.apk > artifacts/package.txt
          grep -F "package: name='jp.gmk.mobile.rule' versionCode='103' versionName='0.7.33-production-audited'" artifacts/package.txt
          cd artifacts
          sha256sum GMK_MOBILE.apk > SHA256.txt
          sha256sum --check SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_V0733_APK
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: GMK-build-diagnostics
          path: "gradle-build.log\n${{ env.GMK_PROJECT }}/app/build/reports/"
          if-no-files-found: ignore
