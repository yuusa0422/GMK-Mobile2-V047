name: Build GMK APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract production source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'GMK_MOBILE_RULE_*.zip' ! -name '*RESEARCH*' | sort -V | tail -1)"
          test -n "$ZIP"
          rm -rf buildsrc && mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          P="$(find buildsrc -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -f "$P/app/build.gradle.kts"
          echo "dir=$P" >> "$GITHUB_OUTPUT"

      - name: Test source
        run: python3 "${{ steps.src.outputs.dir }}/tools/functional_contract_test.py"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          gradle :app:assembleDebug --no-daemon
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: GMK-MOBILE-APK
          path: |
            ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.src.outputs.dir }}/app-debug.apk.sha256
