name: Build GMK Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: gmk-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select source archive by internal version
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY2'
          from pathlib import Path
          import zipfile, os, sys, shutil, re, hashlib, json

          root = Path(".")
          buildsrc = root / "buildsrc"
          shutil.rmtree(buildsrc, ignore_errors=True)

          def safe_extract(zf: zipfile.ZipFile, destination: Path):
              destination.mkdir(parents=True, exist_ok=True)
              root_resolved = destination.resolve()
              for info in zf.infolist():
                  # Reject absolute paths, traversal, and symlink-like entries.
                  name = info.filename.replace("\\", "/")
                  if name.startswith("/") or name.startswith("../") or "/../" in name:
                      raise RuntimeError(f"Unsafe ZIP path: {info.filename}")
                  target = (destination / info.filename).resolve()
                  if target != root_resolved and root_resolved not in target.parents:
                      raise RuntimeError(f"Unsafe ZIP path: {info.filename}")
                  unix_mode = (info.external_attr >> 16) & 0o170000
                  if unix_mode == 0o120000:
                      raise RuntimeError(f"Symlink entry is not allowed: {info.filename}")
              zf.extractall(destination)

          def read_zip_metadata(p: Path):
              try:
                  with zipfile.ZipFile(p) as z:
                      bad = z.testzip()
                      if bad:
                          return None, f"corrupt member: {bad}"

                      gradles = [
                          n for n in z.namelist()
                          if n.replace("\\", "/").endswith("/app/build.gradle.kts")
                          or n.replace("\\", "/") == "app/build.gradle.kts"
                      ]
                      if len(gradles) != 1:
                          return None, f"expected exactly one app/build.gradle.kts, got {len(gradles)}"

                      text = z.read(gradles[0]).decode("utf-8")
                      vc = re.search(r'versionCode\s*=\s*(\d+)', text)
                      vn = re.search(r'versionName\s*=\s*"([^"]+)"', text)
                      appid = re.search(r'applicationId\s*=\s*"([^"]+)"', text)
                      if not (vc and vn and appid):
                          return None, "missing version/applicationId metadata"

                      return {
                          "version_code": int(vc.group(1)),
                          "version_name": vn.group(1),
                          "application_id": appid.group(1),
                          "gradle_member": gradles[0],
                          "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      }, None
              except Exception as e:
                  return None, str(e)

          # Search the repository, not just root. Exclude transient/build folders.
          candidates = []
          for p in root.rglob("*.zip"):
              parts = set(p.parts)
              if ".git" in parts or "buildsrc" in parts or "build" in parts or "release" in parts:
                  continue
              if not p.name.upper().startswith("GMK_MOBILE_RULE_"):
                  continue
              meta, err = read_zip_metadata(p)
              if meta is None:
                  print(f"SKIP INVALID ZIP: {p}: {err}")
                  continue
              candidates.append((p, meta))

          if candidates:
              max_vc = max(meta["version_code"] for _, meta in candidates)
              highest = [(p, meta) for p, meta in candidates if meta["version_code"] == max_vc]

              # Same versionCode with different bytes is ambiguous and dangerous.
              unique_sha = {meta["sha256"] for _, meta in highest}
              if len(unique_sha) > 1:
                  print("ERROR: multiple different source ZIPs share highest versionCode", max_vc)
                  for p, meta in highest:
                      print(" -", p, meta["version_name"], meta["sha256"])
                  sys.exit(2)

              selected, selected_meta = sorted(highest, key=lambda x: x[0].as_posix())[0]
              print("SELECTED SOURCE ZIP:", selected)
              print("INTERNAL VERSION:", selected_meta["version_code"], selected_meta["version_name"])
              print("SOURCE SHA256:", selected_meta["sha256"])

              with zipfile.ZipFile(selected) as z:
                  safe_extract(z, buildsrc)

              search_root = buildsrc
          else:
              selected = None
              selected_meta = None
              search_root = root
              print("NO SOURCE ZIP: attempting extracted Android project in repository")

          projects = []
          for settings in list(search_root.rglob("settings.gradle.kts")) + list(search_root.rglob("settings.gradle")):
              project = settings.parent
              if (project / "app" / "build.gradle.kts").is_file():
                  projects.append(project)

          # Deduplicate resolved paths.
          projects = sorted({p.resolve() for p in projects}, key=lambda p: (len(p.parts), p.as_posix()))
          if len(projects) != 1:
              print("ERROR: expected exactly one Android project, found:", [str(p) for p in projects])
              sys.exit(3)

          project = projects[0]
          rel_project = project.relative_to(Path.cwd().resolve()).as_posix()
          print("PROJECT:", rel_project)

          app_gradle = project / "app" / "build.gradle.kts"
          text = app_gradle.read_text(encoding="utf-8")
          def req(pattern, label):
              m = re.search(pattern, text)
              if not m:
                  print("ERROR missing", label)
                  sys.exit(4)
              return m.group(1)

          vc = req(r'versionCode\s*=\s*(\d+)', "versionCode")
          vn = req(r'versionName\s*=\s*"([^"]+)"', "versionName")
          appid = req(r'applicationId\s*=\s*"([^"]+)"', "applicationId")

          if selected_meta:
              if int(vc) != selected_meta["version_code"] or vn != selected_meta["version_name"]:
                  print("ERROR: extracted metadata differs from ZIP metadata")
                  sys.exit(5)

          context = {
              "source_zip": str(selected) if selected else None,
              "source_sha256": selected_meta["sha256"] if selected_meta else None,
              "project_dir": rel_project,
              "version_code": int(vc),
              "version_name": vn,
              "application_id": appid,
              "git_sha": os.environ.get("GITHUB_SHA", ""),
              "git_ref": os.environ.get("GITHUB_REF", ""),
          }
          Path("build-context.json").write_text(
              json.dumps(context, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(json.dumps(context, ensure_ascii=False, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"project_dir={rel_project}\n")
              f.write(f"version_code={vc}\n")
              f.write(f"version_name={vn}\n")
              f.write(f"application_id={appid}\n")
              if selected:
                  f.write(f"source_zip={selected.as_posix()}\n")
                  f.write(f"source_sha256={selected_meta['sha256']}\n")
          PY2

      - name: Source tree preflight
        shell: bash
        run: |
          set -euo pipefail
          P="${{ steps.locate.outputs.project_dir }}"

          test -f "$P/settings.gradle.kts"
          test -f "$P/build.gradle.kts"
          test -f "$P/app/build.gradle.kts"
          test -f "$P/app/src/main/AndroidManifest.xml"
          test -f "$P/app/src/main/java/jp/gmk/mobile/MainActivity.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/ui/GmkViewModel.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/domain/LocalRuleEngine.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/domain/OneMinuteLocalEngine.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/data/MarketRepository.kt"
          test -f "$P/app/src/main/java/jp/gmk/mobile/data/HistoryStore.kt"

          # Guard against accidentally rebuilding the abandoned PC/Ollama 1-minute branch.
          if grep -R -nE 'OneMinuteAiClient|api/generate|127\.0\.0\.1:11434|192\.168\.[0-9]+\.[0-9]+:11434' \
              "$P/app/src/main/java" "$P/app/src/main/res" 2>/dev/null; then
            echo "ERROR: PC/Ollama dependency detected in smartphone-only source"
            exit 10
          fi

          # Known historical compile regression guard.
          grep -Fq 'import androidx.activity.compose.rememberLauncherForActivityResult' \
            "$P/app/src/main/java/jp/gmk/mobile/MainActivity.kt"
          grep -Fq 'JavaVersion.VERSION_17' "$P/app/build.gradle.kts"
          grep -Fq 'jvmTarget = "17"' "$P/app/build.gradle.kts"

          echo "Source preflight OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import os, sys

          sdk = Path(os.environ.get("ANDROID_SDK_ROOT", os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")))
          preferred = sdk / "cmdline-tools" / "latest" / "bin" / "sdkmanager"

          if preferred.is_file():
              manager = preferred
          else:
              managers = sorted(
                  [p for p in (sdk / "cmdline-tools").rglob("sdkmanager") if p.is_file()],
                  key=lambda p: p.as_posix()
              )
              if not managers:
                  print("ERROR: sdkmanager not found")
                  sys.exit(1)
              manager = managers[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"sdkroot={sdk.as_posix()}\n")
              f.write(f"sdkmanager={manager.as_posix()}\n")

          print("SDK:", sdk)
          print("SDKMANAGER:", manager)
          PY2

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          BT="${{ steps.sdk.outputs.sdkroot }}/build-tools/35.0.0"
          test -x "$BT/apksigner"
          test -x "$BT/aapt"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Toolchain preflight
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "versionCode=${{ steps.locate.outputs.version_code }}"
          echo "versionName=${{ steps.locate.outputs.version_name }}"
          echo "applicationId=${{ steps.locate.outputs.application_id }}"

      - name: Compile Kotlin
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdkroot }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdkroot }}
        run: |
          set -o pipefail

          run_compile() {
            gradle :app:compileDebugKotlin \
              --no-daemon --stacktrace --warning-mode all --console=plain \
              2>&1 | tee "${GITHUB_WORKSPACE}/gradle-compile.log"
          }

          if ! run_compile; then
            if grep -Eqi \
              'Could not resolve|Connection reset|Read timed out|connect timed out|HTTP 50[234]|Temporary failure|Network is unreachable' \
              "${GITHUB_WORKSPACE}/gradle-compile.log"; then
              echo "Transient dependency/network failure detected; retrying once..."
              sleep 5
              gradle :app:compileDebugKotlin \
                --no-daemon --stacktrace --warning-mode all --console=plain --refresh-dependencies \
                2>&1 | tee -a "${GITHUB_WORKSPACE}/gradle-compile.log"
            else
              exit 1
            fi
          fi

      - name: Assemble debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdkroot }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdkroot }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon --stacktrace --warning-mode all --console=plain \
            2>&1 | tee "${GITHUB_WORKSPACE}/gradle-build.log"

      - name: Show actionable build errors
        if: failure()
        shell: bash
        run: |
          set +e
          for F in "${GITHUB_WORKSPACE}/gradle-compile.log" "${GITHUB_WORKSPACE}/gradle-build.log"; do
            if [ -f "$F" ]; then
              echo "========== $F =========="
              grep -nEi \
                '(^e: |error:|FAILURE:|What went wrong|Execution failed|Compilation error|Unresolved reference|Type mismatch|Cannot infer|Expecting|Caused by:|Could not resolve|Manifest merger failed|Duplicate class|AAPT: error)' \
                "$F" | tail -n 900
            fi
          done
          true

      - name: Locate exact APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          import os, sys

          project = Path("${{ steps.locate.outputs.project_dir }}")
          preferred = project / "app" / "build" / "outputs" / "apk" / "debug" / "app-debug.apk"

          if preferred.is_file() and preferred.stat().st_size > 0:
              apk = preferred
          else:
              apks = [
                  p for p in (project / "app" / "build" / "outputs").rglob("*.apk")
                  if p.is_file()
                  and p.stat().st_size > 0
                  and "androidTest" not in p.as_posix()
              ]
              if len(apks) != 1:
                  print("ERROR: expected exactly one application APK, found:", [str(x) for x in apks])
                  sys.exit(1)
              apk = apks[0]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"apk_path={apk.as_posix()}\n")
          print("APK:", apk, apk.stat().st_size)
          PY2

      - name: Verify exact APK metadata and signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ steps.sdk.outputs.sdkroot }}/build-tools/35.0.0"
          APK="${{ steps.apk.outputs.apk_path }}"

          test -n "$APK"
          test -s "$APK"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt

          grep -Fq "package: name='${{ steps.locate.outputs.application_id }}'" apk-badging.txt
          grep -Fq "versionCode='${{ steps.locate.outputs.version_code }}'" apk-badging.txt
          grep -Fq "versionName='${{ steps.locate.outputs.version_name }}'" apk-badging.txt
          grep -Fq "sdkVersion:'26'" apk-badging.txt
          grep -Fq "targetSdkVersion:'35'" apk-badging.txt

      - name: Prepare release bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          SAFE_VERSION="$(printf '%s' '${{ steps.locate.outputs.version_name }}' | tr -cd 'A-Za-z0-9._-')"
          NAME="GMK_MOBILE_RULE_V${SAFE_VERSION}.apk"

          cp "${{ steps.apk.outputs.apk_path }}" "release/$NAME"
          sha256sum "release/$NAME" > "release/$NAME.sha256"
          cp build-context.json release/build-context.json
          cp apk-badging.txt release/apk-badging.txt
          cp apk-signature.txt release/apk-signature.txt

          cat "release/$NAME.sha256"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_RULE_${{ steps.locate.outputs.version_name }}_APK
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prepare failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p failure-diagnostics
          cp build-context.json failure-diagnostics/ 2>/dev/null || true
          cp gradle-compile.log failure-diagnostics/ 2>/dev/null || true
          cp gradle-build.log failure-diagnostics/ 2>/dev/null || true
          cp apk-badging.txt failure-diagnostics/ 2>/dev/null || true
          cp apk-signature.txt failure-diagnostics/ 2>/dev/null || true

          P="${{ steps.locate.outputs.project_dir }}"
          if [ -n "$P" ] && [ -d "$P/app/build/reports" ]; then
            cp -R "$P/app/build/reports" failure-diagnostics/app-build-reports
          fi

          {
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > failure-diagnostics/runner-context.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_RULE_BUILD_FAILURE_${{ github.run_id }}_${{ github.run_attempt }}
          path: failure-diagnostics/**
          if-no-files-found: warn
          retention-days: 14
