                      for i in z.infolist():
                          p = PurePosixPath(i.filename.replace("\\", "/"))
                          if not p.parts or p.is_absolute() or ".." in p.parts or ":" in str(p):
                              raise SystemExit("ERROR: unsafe ZIP path")
                          if archive.name == "GMK_V0735_TEST_DATA.zip":
                              p = PurePosixPath("GMK_MOBILE_V0739_STREAK_20261008", *p.parts[1:])
                          if str(p) in seen:
                              raise SystemExit("ERROR: duplicate ZIP target")
                          seen.add(str(p))
                          if (i.external_attr >> 16) & 0o170000 not in (0, 0o100000, 0o040000):
                              raise SystemExit("ERROR: links and special ZIP entries are forbidden")
                          target = root.joinpath(*p.parts)
                          if i.is_dir():
                              target.mkdir(parents=True, exist_ok=True)
                          else:
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(z.read(i))
          projects = [p.parent for p in root.rglob("settings.gradle.kts") if ".git" not in p.parts and (p.parent / "app/build.gradle.kts").is_file()]
          if len(projects) != 1:
              raise SystemExit("ERROR: expected one Android project or the exact v0.7.39 source ZIP")
          project = projects[0].resolve()
          subprocess.run(["python3", str(project / "tools/restore_bundled_assets.py")], check=True)
          fixture = project / "tools/direct19_feature_fixture.bin"
          fixture_manifest = json.loads((project / "DIRECT19_BUNDLED_FIXTURE_MANIFEST.json").read_text())
          if not fixture.is_file() or hashlib.sha256(fixture.read_bytes()).hexdigest() != fixture_manifest["bundled_sha256"]:
              raise SystemExit("ERROR: missing or corrupted observed-price fixture")
          metadata = (project / "app/build.gradle.kts").read_text()
          expected = {"applicationId": '"jp.gmk.mobile.rule"', "versionCode": "109", "versionName": '"0.7.39-mobile-streak"'}
          if any(not re.search(rf"^\s*{key}\s*=\s*{re.escape(value)}\s*$", metadata, re.M) for key, value in expected.items()):
              raise SystemExit("ERROR: wrong applicationId or production version")
          if any(c in str(project) for c in "\r\n"):
              raise SystemExit("ERROR: invalid project path")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GMK_PROJECT={project}\n")
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          {
            java -version
            javac -version
            gradle --version
            test -f "$ANDROID_HOME/platforms/android-35/android.jar"
            test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
            test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          } 2>&1 | tee "$GITHUB_WORKSPACE/build-environment.log"
      - name: Compile Kotlin and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GMK_PROJECT"
          sha256sum --check --quiet PACKAGE_MANIFEST_SHA256.txt
          python3 tools/direct19_release_audit.py
          gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace --console=plain | tee "$GITHUB_WORKSPACE/gradle-build.log"
          python3 tools/verify_mobile_test_results.py
      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GMK_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GMK_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GMK_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GMK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$GMK_PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          VERIFIED="artifacts/GMK_MOBILE_V0739_TEST_ONLY.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [[ -n "$KEYSTORE_B64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            : "${KEYSTORE_B64:?Missing keystore}" "${STORE_PASSWORD:?Missing store password}" "${KEY_ALIAS:?Missing key alias}" "${KEY_PASSWORD:?Missing key password}"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gmk.keystore"
            APK="$GMK_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/gmk.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out artifacts/GMK_MOBILE_V0739_PRODUCTION.apk "$APK"
            VERIFIED="artifacts/GMK_MOBILE_V0739_PRODUCTION.apk"
            echo existing-production-key > artifacts/signing-mode.txt
          else
            cp "$APK" "$VERIFIED"
            cp "$GMK_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk" artifacts/GMK_MOBILE_V0739_RELEASE_UNSIGNED.apk
            echo test-only-debug-production-unsigned > artifacts/signing-mode.txt
          fi
          "$BT/apksigner" verify --verbose --print-certs "$VERIFIED" | tee artifacts/signature.txt
          "$BT/aapt" dump badging "$VERIFIED" > artifacts/package.txt
          grep -F "package: name='jp.gmk.mobile.rule' versionCode='109' versionName='0.7.39-mobile-streak'" artifacts/package.txt
          grep -Fx "sdkVersion:'26'" artifacts/package.txt
          grep -Fx "targetSdkVersion:'35'" artifacts/package.txt
          python3 "$GMK_PROJECT/tools/verify_apk_assets.py" "$VERIFIED" > artifacts/model-verification.json
          cp "$GITHUB_WORKSPACE/build-environment.log" artifacts/build-environment.log
          cp "$GITHUB_WORKSPACE/gradle-build.log" artifacts/gradle-build.log
          cp "$GMK_PROJECT/app/build/test-results/testDebugUnitTest/"TEST*.xml artifacts/
          cd artifacts
          sha256sum ./*.apk > SHA256.txt
          sha256sum --check SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GMK_MOBILE_V0739_APK
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: GMK-build-diagnostics
          path: "build-environment.log\ngradle-build.log\n${{ env.GMK_PROJECT }}/app/build/reports/"
          if-no-files-found: ignore
