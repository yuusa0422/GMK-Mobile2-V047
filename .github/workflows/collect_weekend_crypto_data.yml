name: GMK weekend crypto candles (Sep-Oct 2026)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First JST calendar date (inclusive)
        required: true
        type: string
        default: "2026-09-01"
      end_date:
        description: Last JST calendar date (inclusive; current day is partial)
        required: true
        type: string
        default: "2026-10-10"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate collector source
        id: collector
        shell: bash
        run: |
          mapfile -t matches < <(find . -maxdepth 5 -type f -name collect_crypto_data.py -not -path './.git/*' | sort)
          if (( ${#matches[@]} != 1 )); then
            echo "ERROR: expected exactly one collect_crypto_data.py; found ${#matches[@]}"
            printf '%s\n' "${matches[@]}"
            exit 1
          fi
          project_dir="${matches[0]%/collect_crypto_data.py}"
          project_dir="${project_dir#./}"
          if [[ -z "$project_dir" ]]; then project_dir="."; fi
          if [[ ! -f "$project_dir/test_collect_crypto_data.py" ]]; then
            echo "ERROR: test_collect_crypto_data.py is missing beside the collector at $project_dir"
            exit 1
          fi
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Run offline tests
        working-directory: ${{ steps.collector.outputs.project_dir }}
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import unittest

          test_file = pathlib.Path("test_collect_crypto_data.py")
          if not test_file.is_file():
              raise SystemExit(f"ERROR: test file not found in {pathlib.Path.cwd()}")
          suite = unittest.defaultTestLoader.discover(".", pattern="test_collect_crypto_data.py")
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("ERROR: unittest discovered zero tests; refusing to continue")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Download official public candles
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        working-directory: ${{ steps.collector.outputs.project_dir }}
        run: python collect_crypto_data.py --start-date "$START_DATE" --end-date "$END_DATE" --output artifacts/crypto-data
      - name: Upload September/October dataset
        uses: actions/upload-artifact@v4
        with:
          name: GMK_CRYPTO_1M_JST_${{ inputs.start_date }}_${{ inputs.end_date }}
          path: ${{ steps.collector.outputs.project_dir }}/artifacts/crypto-data/
          if-no-files-found: error
          retention-days: 90
