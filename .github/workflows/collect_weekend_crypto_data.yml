name: GMK weekend crypto candles (Sep-Oct 2026)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First JST calendar date (inclusive)
        required: true
        type: string
        default: "2026-09-01"
      end_date:
        description: Last JST calendar date (inclusive; current day is partial)
        required: true
        type: string
        default: "2026-10-10"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract collector source bundle
        id: collector
        run: |
          python - <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path

          repo = Path.cwd().resolve()
          archives = sorted(p for p in repo.glob("GMK_CRYPTO_DATA_GITHUB_202609_202610*.zip") if p.is_file())
          if not archives:
              raise SystemExit(
                  "ERROR: source bundle is missing. Upload GMK_CRYPTO_DATA_GITHUB_202609_202610.zip "
                  "to the repository root, commit it, then rerun this workflow."
              )
          if len(archives) != 1:
              raise SystemExit(f"ERROR: expected one collector ZIP in repository root; found {len(archives)}")

          runtime = repo / ".gmk_crypto_data_runtime"
          if runtime.exists():
              shutil.rmtree(runtime)
          runtime.mkdir()
          with zipfile.ZipFile(archives[0]) as archive:
              for item in archive.infolist():
                  target = (runtime / item.filename).resolve()
                  if target != runtime and runtime not in target.parents:
                      raise SystemExit(f"ERROR: unsafe path in source bundle: {item.filename}")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f"ERROR: symbolic link rejected in source bundle: {item.filename}")
              archive.extractall(runtime)

          sources = list(runtime.rglob("collect_crypto_data.py"))
          if len(sources) != 1:
              raise SystemExit(f"ERROR: source ZIP must contain exactly one collector; found {len(sources)}")
          project = sources[0].parent
          if not (project / "test_collect_crypto_data.py").is_file():
              raise SystemExit("ERROR: source ZIP is missing test_collect_crypto_data.py beside the collector")
          relative = project.relative_to(repo)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"project_dir={relative.as_posix()}\n")
          print(f"Collector source prepared at {relative}")
          PY

      - name: Run offline tests
        working-directory: ${{ steps.collector.outputs.project_dir }}
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import unittest

          test_file = pathlib.Path("test_collect_crypto_data.py")
          if not test_file.is_file():
              raise SystemExit(f"ERROR: test file not found in {pathlib.Path.cwd()}")
          suite = unittest.defaultTestLoader.discover(".", pattern="test_collect_crypto_data.py")
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("ERROR: unittest discovered zero tests; refusing to continue")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Download official public candles
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        working-directory: ${{ steps.collector.outputs.project_dir }}
        run: python collect_crypto_data.py --start-date "$START_DATE" --end-date "$END_DATE" --output artifacts/crypto-data
      - name: Upload September/October dataset
        uses: actions/upload-artifact@v4
        with:
          name: GMK_CRYPTO_1M_JST_${{ inputs.start_date }}_${{ inputs.end_date }}
          path: ${{ steps.collector.outputs.project_dir }}/artifacts/crypto-data/
          if-no-files-found: error
          retention-days: 90
