name: GMK fetch yen 5 pairs Sep-Nov 1-minute
# 9〜11月の検証用: 円の5ペア（USDJPY EURJPY GBPJPY AUDJPY NZDJPY）の1分足を Dukascopy から取得します（1ペア1ジョブ）。
# 1日分の1分足ファイルがまだ無い直近の日（今日など）は、1時間ごとのティックから1分足を作ります（終わった時間まで）。
# 取れなかった日は report に残して次へ進みます。結果は1つのZIP（GMK_YEN5_M1_開始日_終了日）にまとまります。
on:
  workflow_dispatch:
    inputs:
      start_date: {description: '開始日 UTC (YYYY-MM-DD)', required: true, default: '2026-08-24'}
      end_date: {description: '終了日 UTC (YYYY-MM-DD, この日を含む)', required: true, default: '2026-11-04'}
      symbols: {description: 'ペア（空白区切り）', required: true, default: 'USDJPY EURJPY GBPJPY AUDJPY NZDJPY'}
permissions:
  contents: read
env:
  START_DATE: ${{ inputs.start_date }}
  END_DATE: ${{ inputs.end_date }}
  PYTHONUNBUFFERED: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      symbols: ${{ steps.p.outputs.symbols }}
    steps:
      - id: p
        env: {SYMS: '${{ inputs.symbols }}'}
        run: python3 -c "import json,os,re;s=[x for x in os.environ['SYMS'].split() if re.fullmatch(r'[A-Z]{6}',x)];print('symbols='+json.dumps(s))" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sym: ${{ fromJson(needs.plan.outputs.symbols) }}
    steps:
      - name: Fetch ${{ matrix.sym }}
        env: {SYM: '${{ matrix.sym }}'}
        run: |
          cat > fetch.py <<'PY'
          import csv, datetime as dt, gzip, hashlib, json, lzma, os, struct, time, urllib.error, urllib.request
          from pathlib import Path
          SYM = os.environ['SYM']; BUDGET = 190 * 60; T0 = time.monotonic(); UTC = dt.timezone.utc
          start = dt.date.fromisoformat(os.environ['START_DATE']); end = dt.date.fromisoformat(os.environ['END_DATE'])
          NOW = dt.datetime.now(UTC); TODAY = NOW.date(); end = min(end, TODAY)
          OUT = Path('pairs'); OUT.mkdir(exist_ok=True)
          report = {'symbol': SYM, 'start': str(start), 'end': str(end), 'run_utc': NOW.isoformat(timespec='seconds'),
                    'errors': [], 'requests': 0, 'tick_days': {}}
          def log(*a): print(f'[{SYM} {time.monotonic() - T0:6.0f}s]', *a, flush=True)
          def get(url):
              last = None
              for k, w in enumerate([3, 10, 30, 60]):
                  if time.monotonic() - T0 > BUDGET: raise RuntimeError('time budget exhausted')
                  report['requests'] += 1
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': '*/*'})
                      with urllib.request.urlopen(req, timeout=40) as r: return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code == 404: return None
                      last = f'HTTP {e.code}'
                  except Exception as e: last = f'{type(e).__name__}: {e}'
                  log('retry', k + 1, last); time.sleep(w)
              raise RuntimeError(last)
          def base_url(day): return f'https://datafeed.dukascopy.com/datafeed/{SYM}/{day.year}/{day.month - 1:02d}/{day.day:02d}/'
          def from_ticks(day):
              """1-minute BID candles from the hourly tick files, for finished hours only (same price scale as the candle files).
              Minutes without a tick inside the traded span get a flat candle at the last bid, like Dukascopy's own minute files."""
              out = []; hours = 0
              for hh in range(24):
                  h0 = dt.datetime.combine(day, dt.time(hh), UTC)
                  if h0 + dt.timedelta(hours=1) > NOW: break
                  raw = get(base_url(day) + f'{hh:02d}h_ticks.bi5')
                  if not raw: continue
                  data = lzma.decompress(raw); h0ms = int(h0.timestamp() * 1000); m = {}
                  for k in range(0, len(data) - 19, 20):
                      ms, ask, bid, av, bv = struct.unpack('>3i2f', data[k:k + 20])
                      if not (0 <= ms < 3600000) or bid <= 0: continue
                      t = h0ms + (ms // 60000) * 60000; c = m.get(t)
                      if c is None: m[t] = [bid, bid, bid, bid, float(bv)]
                      else: c[1] = max(c[1], bid); c[2] = min(c[2], bid); c[3] = bid; c[4] += float(bv)
                  if not m: continue
                  hours += 1; ts = sorted(m); prev = None
                  for t in range(ts[0], ts[-1] + 60000, 60000):
                      c = m.get(t)
                      if c is None: c = [prev, prev, prev, prev, 0.0]
                      out.append((t, c[0], c[1], c[2], c[3], c[4])); prev = c[3]
              return out, hours
          rows = []; day = start; days_ok = 0; empty = 0
          while day <= end and time.monotonic() - T0 <= BUDGET:
              if day.weekday() == 5: day += dt.timedelta(days=1); continue
              try:
                  raw = get(base_url(day) + 'BID_candles_min_1.bi5'); n0 = len(rows)
                  if raw:
                      data = lzma.decompress(raw); base = dt.datetime.combine(day, dt.time(0), UTC).timestamp()
                      for k in range(0, len(data) - 23, 24):
                          sec, o, c, l, h, v = struct.unpack('>5if', data[k:k + 24])
                          if 0 <= sec < 86400 and o > 0 and c > 0 and h >= max(o, c) and l <= min(o, c):
                              rows.append((int((base + sec) * 1000), o, h, l, c, v))
                  if len(rows) == n0 and (TODAY - day).days <= 3:
                      tk, hrs = from_ticks(day); rows.extend(tk); report['tick_days'][str(day)] = {'hours': hrs, 'bars': len(tk)}
                      log('built from ticks', day, hrs, 'hours', len(tk), 'bars')
                  if len(rows) > n0: days_ok += 1
                  else: empty += 1
              except Exception as e:
                  report['errors'].append({'date': str(day), 'error': str(e)[:200]}); log('ERROR', day, e)
              if day.day == 1: log(day, len(rows), 'bars')
              if days_ok == 0 and empty >= 15: log('no data for 15 days - symbol skipped'); report['missing'] = True; break
              day += dt.timedelta(days=1); time.sleep(0.2)
          if rows:
              # prices are Dukascopy's scaled integers (point size differs by pair); returns do not depend on the scale
              path = OUT / f'{SYM}_1m_raw.csv.gz'; rows = sorted({r[0]: r for r in rows}.values())
              with gzip.open(path, 'wt', newline='') as f:
                  w = csv.writer(f); w.writerow(['epoch_ms', 'open', 'high', 'low', 'close', 'volume'])
                  for r in rows: w.writerow(r)
              report.update(rows=len(rows), days_with_data=days_ok, first_close_raw=rows[0][4],
                            last_bar_utc=dt.datetime.fromtimestamp(rows[-1][0] / 1000, UTC).isoformat(timespec='minutes'),
                            sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          report['stopped_at'] = str(min(day, end))
          (OUT / f'report_{SYM}.json').write_text(json.dumps(report, indent=1) + '\n')
          log('done', report.get('rows', 0), 'bars', days_ok, 'days', len(report['errors']), 'errors', 'last', report.get('last_bar_utc'))
          PY
          python3 fetch.py
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: pair_${{ matrix.sym }}
          path: pairs/
          if-no-files-found: warn
  collect:
    needs: fetch
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'pair_*', path: pairs, merge-multiple: true}
      - name: Summary
        run: |
          ls -la pairs || true
          for f in pairs/report_*.json; do python3 -c "import json,sys;r=json.load(open(sys.argv[1]));print(r['symbol'],r.get('rows',0),'bars',r.get('days_with_data',0),'days',len(r['errors']),'errors','last',r.get('last_bar_utc'),'ticks',r.get('tick_days'))" "$f"; done
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: GMK_YEN5_M1_${{ inputs.start_date }}_${{ inputs.end_date }}
          path: pairs/
          if-no-files-found: warn
